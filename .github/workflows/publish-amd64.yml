name: publish-amd64
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Image tag
        required: false
        default: altare39
permissions:
  contents: read
  packages: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ghcr.io/${{ github.repository }}:${{ inputs.tag }}
      - name: Make package public
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for i in 1 2 3 4 5 6 8 10; do
            if gh api --method PUT "/user/packages/container/xray-hostless/visibility" -f visibility=public; then
              echo "package is public"
              exit 0
            fi
            sleep "$i"
          done
          echo "could not set package visibility; inspect may need a token"
          exit 0
